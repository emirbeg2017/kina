services:
  - type: web
    name: kinabot-pilot
    runtime: docker
    dockerfilePath: ./Dockerfile.pilot
    plan: standard
    healthCheckPath: /api/health
    disk:
      name: pilot-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PILOT_INVITE_CODE
        sync: false
